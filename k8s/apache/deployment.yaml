apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-deployment
  namespace: demo-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apache
  template:
    metadata:
      labels:
        app: apache
      annotations:
        pipeline-test: "run1"
    spec:
      volumes:
        - name: apache-logs
          emptyDir: {}
        - name: mtail-config
          configMap:
            name: apache-mtail-config

      containers:

        # 🔵 APACHE CONTAINER — CLEAN DEFAULT CONFIG
        - name: apache
          image: httpd:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: apache-logs
              mountPath: /usr/local/apache2/logs
          command: ["/bin/sh"]
          args:
            - -c
            - |
              echo 'LogFormat "%h %l %u %t \"%r\" %>s %b" common' >> /usr/local/apache2/conf/httpd.conf
              echo 'CustomLog "/usr/local/apache2/logs/access_log" common' >> /usr/local/apache2/conf/httpd.conf
              httpd -D FOREGROUND

        # 🔴 MTAIL CONTAINER — PARSES APACHE LOGS
        - name: mtail
          image: ghcr.io/google/mtail:latest
          args:
            - -progs
            - /etc/mtail
            - -logs
            - /logs/access_log
            - -port
            - "3903"
          ports:
            - containerPort: 3903
          volumeMounts:
            - name: apache-logs
              mountPath: /logs
            - name: mtail-config
              mountPath: /etc/mtail
